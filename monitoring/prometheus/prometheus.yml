global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: urf-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - urf-lab8-test-app-1:8000
        labels:
          environment: lab8-test

  - job_name: urf-staging
    metrics_path: /metrics
    static_configs:
      - targets:
          - urf-staging-app-1:8000
        labels:
          environment: staging

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
