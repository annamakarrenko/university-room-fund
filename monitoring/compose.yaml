name: urf-monitoring

services:
  prometheus:
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
      - application
      - staging
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped

  grafana:
    image: grafana/grafana@sha256:70d9599b186ce287be0d2c5ba9a78acb2e86c1a68c9c41449454d0fc3eeb84e8
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - monitoring
      - frontend
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    volumes:
      - /:/host:ro,rslave
    pid: host
    networks:
      - monitoring
    mem_limit: 128m
    cpus: 0.2
    pids_limit: 64
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor@sha256:e02855207ec07bb45ee41f720645945251f093f24c28f8c29cf718490f784922
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /var/lib/containerd:/var/lib/containerd:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    cgroup: host
    networks:
      - monitoring
    mem_limit: 256m
    cpus: 0.3
    pids_limit: 128
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge
    internal: true
  frontend:
    driver: bridge
  application:
    external: true
    name: urf-lab8-test_frontend

  staging:
    external: true
    name: urf-staging_frontend

volumes:
  prometheus_data:
  grafana_data:
