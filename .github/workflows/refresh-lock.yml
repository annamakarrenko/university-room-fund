name: Lab5 Refresh Requirements Lock

on:
  push:
    branches:
      - lab5/ci-pipeline
    paths:
      - requirements.txt
      - .github/workflows/refresh-lock.yml

permissions:
  contents: read

jobs:
  refresh-lock:
    name: Generate Requirements Lock
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pip-tools
        run: python -m pip install pip-tools

      - name: Generate lock file with SHA256 hashes
        run: |
          python -m piptools compile \
            --generate-hashes \
            --output-file=requirements.lock \
            requirements.txt

      - name: Upload updated lock file
        uses: actions/upload-artifact@v4
        with:
          name: lab5-updated-requirements-lock
          path: requirements.lock
          if-no-files-found: error
