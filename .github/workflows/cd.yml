name: Lab6 Continuous Delivery

on:
  workflow_run:
    workflows: ["Lab5 Continuous Integration"]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: urf-staging-cd
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:urf-cd

      - name: Prepare SSH
        shell: bash
        env:
          CD_SSH_KEY: ${{ secrets.URF_CD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077

          printf '%s\n' "$CD_SSH_KEY" > "$RUNNER_TEMP/urf_cd_key"
          chmod 600 "$RUNNER_TEMP/urf_cd_key"

          ssh-keyscan -T 10 -t ed25519 100.66.126.101 \
            > "$RUNNER_TEMP/urf_known_hosts" 2>/dev/null

          ssh-keygen -lf "$RUNNER_TEMP/urf_known_hosts" -E sha256 \
            | grep -Fq 'SHA256:GCtvtbCZXnDFNoISCOpmFhduMod68OSGKpOVutXgCh8'

      - name: Check published release
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          ssh -i "$RUNNER_TEMP/urf_cd_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/urf_known_hosts" \
            urfdeploy@100.66.126.101 \
            "check $RELEASE_SHA"

      - name: Deploy published release
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          ssh -i "$RUNNER_TEMP/urf_cd_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/urf_known_hosts" \
            urfdeploy@100.66.126.101 \
            "deploy $RELEASE_SHA"
