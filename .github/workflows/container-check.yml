name: Container Check

on:
  pull_request:
  push:
    branches:
      - main
      - lab4/docker-image
      - lab4/compose-db
      - lab4/container-check

jobs:
  container-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare test environment
        run: |
          umask 077
          printf 'DB_PASSWORD=%s\nSESSION_SECRET=%s\n' \
            "$(openssl rand -hex 24)" \
            "$(openssl rand -hex 32)" > .env

      - name: Build application image
        run: docker compose build

      - name: Validate container policies
        run: make container-check

      - name: Test rejection of unsafe changes
        run: python3 scripts/test_container_policy.py

      - name: Start and verify services
        run: |
          docker compose up -d --wait --wait-timeout 120
          docker compose ps -a
          curl --fail --show-error --max-time 10 \
            http://127.0.0.1:8000/health
          test "$(docker compose exec -T app id -u)" = "10001"

      - name: Cleanup
        if: always()
        run: docker compose down --remove-orphans
