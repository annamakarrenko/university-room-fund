name: Lab5 Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run quality checks
        run: make quality PYTHON=python

      - name: Generate analyzer reports
        if: always()
        continue-on-error: true
        run: |
          mkdir -p reports
          python -m ruff check . --output-format json --output-file reports/ruff.json
          python -m bandit -r app -f json -o reports/bandit.json

      - name: Upload analyzer reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab5-quality-reports
          path: |
            reports/ruff.json
            reports/bandit.json
          if-no-files-found: error

  tests:
    name: Automated Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run tests and coverage
        run: make coverage PYTHON=python

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab5-test-reports
          path: |
            reports/tests.xml
            reports/coverage.xml
          if-no-files-found: warn

  migrations:
    name: PostgreSQL Migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare isolated database
        run: |
          umask 077
          printf 'CI_DB_PASSWORD=%s\n' \
            "$(openssl rand -hex 24)" > .env.ci

      - name: Build application image
        run: docker build -t university-room-fund:lab4 .

      - name: Run Alembic migration checks
        run: |
          set -a
          source .env.ci
          set +a
          CI_PROJECT=urf-ci-migrations \
            bash scripts/ci_migration_check.sh

      - name: Cleanup test database
        if: always()
        run: |
          docker compose \
            -p urf-ci-migrations \
            --env-file .env.ci \
            -f compose.ci.yaml \
            down -v --remove-orphans || true

  backup:
    name: Database Backup
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare isolated database
        run: |
          umask 077
          printf 'CI_DB_PASSWORD=%s\n' \
            "$(openssl rand -hex 24)" > .env.ci

      - name: Build application image
        run: docker build -t university-room-fund:lab4 .

      - name: Apply migrations
        run: |
          set -a
          source .env.ci
          set +a
          CI_PROJECT=urf-ci-backup \
            bash scripts/ci_migration_check.sh

      - name: Create and verify backup
        run: |
          mkdir -p reports
          umask 077

          docker compose \
            -p urf-ci-backup \
            --env-file .env.ci \
            -f compose.ci.yaml \
            exec -T ci-db \
            pg_dump -U ci_user -d university_fund_ci -Fc \
            > reports/ci-backup.dump

          test -s reports/ci-backup.dump

          docker compose \
            -p urf-ci-backup \
            --env-file .env.ci \
            -f compose.ci.yaml \
            exec -T ci-db pg_restore -l \
            < reports/ci-backup.dump \
            > reports/backup-check.txt

          grep -Eq 'TABLE public buildings ' reports/backup-check.txt
          grep -Eq 'TABLE public rooms ' reports/backup-check.txt

          echo "BACKUP CHECK PASSED"

      - name: Upload backup validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab5-backup-report
          path: reports/backup-check.txt
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          docker compose \
            -p urf-ci-backup \
            --env-file .env.ci \
            -f compose.ci.yaml \
            down -v --remove-orphans || true

  secrets:
    name: Secret Scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  dependency-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit Python dependencies
        run: |
          python -m pip_audit \
            -r requirements.txt \
            -r requirements-dev.txt \
            --progress-spinner off \
            --format json \
            --output dependency-audit.json

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab5-dependency-audit
          path: dependency-audit.json
          if-no-files-found: warn

  image-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t university-room-fund:ci-scan .

      - name: Scan image and save report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: university-room-fund:ci-scan
          format: json
          output: trivy-image-report.json
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: '0'

      - name: Upload image scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab5-trivy-image-report
          path: trivy-image-report.json
          if-no-files-found: warn

      - name: Block vulnerable images
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: university-room-fund:ci-scan
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: '1'
          skip-setup-trivy: true

  publish:
    name: Publish Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    needs:
      - quality
      - tests
      - migrations
      - backup
      - secrets
      - dependency-audit
      - image-scan
      - container-check

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  container-check:
    name: Container Policy Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare test environment
        run: |
          umask 077
          printf 'DB_PASSWORD=%s\nSESSION_SECRET=%s\n' \
            "$(openssl rand -hex 24)" \
            "$(openssl rand -hex 32)" > .env

      - name: Build application image
        run: docker compose build

      - name: Check container configuration
        run: |
          python scripts/container_check.py
          python scripts/test_container_policy.py
