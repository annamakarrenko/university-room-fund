---
- name: Ensure SSH service is enabled
  ansible.builtin.service:
    name: ssh
    enabled: true
    state: started

- name: Configure SSH security settings
  ansible.builtin.template:
    src: 00-urf-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-urf-hardening.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH
